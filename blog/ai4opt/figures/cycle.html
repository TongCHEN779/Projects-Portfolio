<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odd cycles are certified by a triangulation</title>
<style>
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#222;overflow:hidden}
  #wrap{display:flex;flex-wrap:wrap}
  canvas{display:block;width:360px;height:360px;max-width:100%}
  #side{flex:1;min-width:260px;padding:12px 16px;font-size:13px}
  .row{display:flex;align-items:center;gap:10px;margin:3px 0 10px}
  .row label{color:#444}input[type=range]{flex:1}
  .val{font-family:monospace;color:#c0392b;min-width:30px;text-align:right}
  table{border-collapse:collapse;width:100%;font-size:13px}
  td{padding:5px 6px;border-bottom:1px solid #eee}td:last-child{text-align:right;font-family:monospace}
  .good{color:#1e8e5a;font-weight:700}.bad{color:#c0392b}
  #note{margin-top:10px;color:#555}
</style></head><body>
<div id="wrap">
  <canvas id="c" width="360" height="360"></canvas>
  <div id="side">
    <div class="row"><label>cycle length m (odd)</label><input id="m" type="range" min="3" max="21" step="2" value="9"><span class="val" id="mv"></span></div>
    <table>
      <tr><td>monomials, order-2 relaxation (all pairs)</td><td id="t2"></td></tr>
      <tr><td>monomials, triangulated walk (<b>2m−3</b>)</td><td id="tw" class="good"></td></tr>
      <tr><td>Goemans–Williamson bound −m cos(π/m)</td><td id="gw" class="bad"></td></tr>
      <tr><td>walk bound = exact optimum −(m−2)</td><td id="ex" class="good"></td></tr>
      <tr><td>GW bound gap</td><td id="gap"></td></tr>
    </table>
    <div id="note"></div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),M=document.getElementById('m');
function draw(){
  const m=+M.value;document.getElementById('mv').textContent=m;
  g.clearRect(0,0,360,360);const R=140,cx=180,cy=184;
  const P=[...Array(m)].map((_,i)=>{const a=-Math.PI/2+2*Math.PI*i/m;return [cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  // fan triangulation from vertex 0
  g.fillStyle='rgba(47,111,224,0.08)';g.beginPath();P.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.fill();
  g.strokeStyle='#e08a2f';g.lineWidth=1.6;g.setLineDash([5,4]);
  for(let j=2;j<m-1;j++){g.beginPath();g.moveTo(...P[0]);g.lineTo(...P[j]);g.stroke();}
  g.setLineDash([]);g.strokeStyle='#2f6fe0';g.lineWidth=2.6;g.beginPath();P.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.stroke();
  P.forEach(p=>{g.beginPath();g.arc(p[0],p[1],m>13?4:6,0,7);g.fillStyle='#fff';g.fill();g.strokeStyle='#333';g.lineWidth=1.3;g.stroke();});
  g.font='12px sans-serif';g.fillStyle='#2f6fe0';g.textAlign='left';g.fillText('— cycle edges (m)',10,16);
  g.fillStyle='#e08a2f';g.fillText('- - chords of the triangulation (m−3)',10,32);
  const gw=-m*Math.cos(Math.PI/m),ex=-(m-2);
  document.getElementById('t2').textContent=m*(m-1)/2;
  document.getElementById('tw').textContent=2*m-3;
  document.getElementById('gw').textContent=gw.toFixed(3);
  document.getElementById('ex').textContent=ex.toFixed(3);
  document.getElementById('gap').textContent=(ex-gw).toFixed(3);
  document.getElementById('note').innerHTML='m−2 triangles, glued along chords. Each triangle contributes its four inequalities; chaining them gives Σ εₑYₑ ≥ −(m−2), which matches the best cut. The GW bound is loose by '+(ex-gw).toFixed(3)+'.';
}
M.oninput=draw;draw();
</script></body></html>
